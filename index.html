<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>High Noon — Draw Fast, Live Long</title>
  <meta name="description" content="High Noon is a free 1v1 western duel game. Draw fast, live long. Play now in your browser and join the Discord.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="canonical" href="https://high-noon.co/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="High Noon — Draw Fast, Live Long">
  <meta property="og:description" content="Free 1v1 western duels. Draw fast, live long. Play now in your browser.">
  <meta property="og:url" content="https://high-noon.co/">
  <meta property="og:image" content="https://high-noon.co/assets/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2A1508">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood-dark: #2A1508;
      --wood: #4A2713;
      --wood-light: #6B3B22;
      --red: #A64B2E;
      --red-hover: #C85A3A;
      --cream: #F2E7D2;
      --gold: #C89A5B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--cream);
      background: var(--wood-dark) url("assets/street.jpg") center 35% / cover no-repeat fixed;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 20px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center 30%, rgba(42,21,8,.15) 0%, rgba(42,21,8,.55) 65%, rgba(42,21,8,.85) 100%);
      pointer-events: none;
      z-index: 0;
    }
    main {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 460px;
      flex: 1;
    }
    .poster {
      width: 100%;
      border: 6px solid var(--wood);
      outline: 2px solid var(--gold);
      outline-offset: -10px;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
      background: var(--wood);
      overflow: hidden;
    }
    .poster img { display: block; width: 100%; height: auto; }
    .tagline {
      margin: 22px 0 18px;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.5;
      text-shadow: 0 2px 6px rgba(0,0,0,.7);
      max-width: 36ch;
    }
    .tagline strong { color: #F4C36A; }
    .actions { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      font-family: "Rye", Georgia, serif;
      font-size: 1.45rem;
      letter-spacing: .04em;
      padding: 16px 20px;
      border-radius: 8px;
      border: 4px solid var(--wood);
      box-shadow: inset 0 0 0 2px rgba(242,231,210,.35), 0 8px 18px rgba(0,0,0,.45);
      transition: transform .08s ease, filter .15s ease;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px rgba(242,231,210,.35), 0 3px 8px rgba(0,0,0,.45); }
    .btn-play { background: var(--red); color: var(--cream); }
    .btn-discord { background: var(--cream); color: var(--wood); font-size: 1.15rem; padding: 13px 20px; }
    .btn-discord svg { width: 22px; height: 22px; vertical-align: -5px; margin-right: 8px; fill: currentColor; }
    footer {
      position: relative; z-index: 1;
      margin-top: 28px;
      padding: 12px 18px;
      border-top: 1px solid rgba(200,154,91,.45);
      font-size: .82rem;
      color: rgba(242,231,210,.85);
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    footer a { color: var(--gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (min-width: 900px) {
      body { padding-top: 40px; }
      main { max-width: 480px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="poster">
      <img src="assets/hero.jpg" alt="High Noon — a sheriff faces an outlaw in a dusty western street. Draw fast, live long." width="850" height="1380" fetchpriority="high">
    </div>

    <p class="tagline">
      <strong>Free 1v1 western duels.</strong><br>
      Draw first, aim true, climb the ranks. Plays right in your browser.
    </p>

    <div class="actions">
      <a class="btn btn-play" href="https://high-noon-reborn.web.app/">★ Play Now ★</a>
      <a class="btn btn-discord" href="https://discord.gg/pgaUv6MX" target="_blank" rel="noopener">

      </a>
    </div>
  </main>

  <footer>
    © 2026 High Noon · <a href="mailto:contact@high-noon.co">contact@high-noon.co</a>
  </footer>
</body>
</html>
